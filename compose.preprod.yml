# Preprod needs only a local proof server; the node and indexer are remote.
# The version follows Midnight's Preprod support matrix.
services:
  proof-server:
    image: 'midnightntwrk/proof-server:8.1.3'
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
